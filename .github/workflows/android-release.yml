name: Build PRime v1.0.0 APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production web bundle and sync Android
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://backend-production-fa614.up.railway.app/api/
          VITE_GOOGLE_CLIENT_ID: 891721708902-8e7d4r9jvfipncpm80o5jtgpfri6dhsj.apps.googleusercontent.com
        run: |
          npm run build
          npx cap sync android

      - name: Restore permanent PRime release signing key
        working-directory: frontend/android
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf signing-backup
          gh run download 36535598269             --repo "${{ github.repository }}"             --name PRIME-RELEASE-SIGNING-BACKUP-KEEP-PRIVATE             --dir signing-backup

          cp signing-backup/prime-release-key.jks prime-release-key.jks

          STORE_PASS="$(sed -n 's/^Keystore password: //p' signing-backup/PRIME_SIGNING_BACKUP.txt | head -1)"
          KEY_PASS="$(sed -n 's/^Key password: //p' signing-backup/PRIME_SIGNING_BACKUP.txt | head -1)"
          KEY_ALIAS="$(sed -n 's/^Key alias: //p' signing-backup/PRIME_SIGNING_BACKUP.txt | head -1)"

          test -n "$STORE_PASS"
          test -n "$KEY_PASS"
          test -n "$KEY_ALIAS"

          cat > key.properties <<EOF
          storeFile=prime-release-key.jks
          storePassword=$STORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Build signed release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify permanent release signature
        working-directory: frontend/android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          grep -qi "certificate SHA-1 digest: 0d7cf439cb60f639fc8a675ba1a6193f2f846222" signature.txt
          cp "$APK" PRime.apk
          sha256sum PRime.apk | tee PRime.apk.sha256

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRime-v1.0.0
          path: |
            frontend/android/PRime.apk
            frontend/android/PRime.apk.sha256

      - name: Publish GitHub Release
        working-directory: frontend/android
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v1.0.0 PRime.apk PRime.apk.sha256 --clobber
